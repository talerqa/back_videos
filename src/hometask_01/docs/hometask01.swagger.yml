tags:
  - name: Videos
    description: API for managing videos

paths:
  /api/hometask_01/api/testing/all-data:
    delete:
      summary: Delete all video
      tags: [ Videos ]
      responses:
        204:
          description:  All data is deleted
        404:
          description: Video not found
        405:
          description: Not Allowed
  /api/hometask_01/api/videos:
    get:
      summary: Get a list of all videos
      tags: [ Videos ]
      responses:
        200:
          description: Returns all videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'
        404:
          description: Not Found
    post:
      summary: Add a new video
      tags: [ Videos ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoInputModel'
      responses:
        201:
          description: The driver was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/hometask_01/api/videos/{id}:
    get:
      summary: Get a video by ID
      tags: [ Videos ]
      parameters:
        - in: path
          name: id
          required: true
          description: "The unique identifier of the driver"
          schema:
            type: integer
            example: 2
      responses:
        200:
          description: The requested driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        404:
          description: Video not found
    put:
      summary: Update a video by ID
      tags: [ Videos ]
      parameters:
        - in: path
          name: id
          required: true
          description: "The unique identifier of the driver"
          schema:
            type: integer
            example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVideoInputModel'
      responses:
        204:
          description: Video updated successfully
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        404:
          description: Video not found
    delete:
      summary: Delete a video by ID
      tags: [ Videos ]
      parameters:
        - in: path
          name: id
          required: true
          description: "The unique identifier of the video"
          schema:
            type: integer
            example: 2
      responses:
        204:
          description: Video deleted successfully
        404:
          description: Video not found
components:
  schemas:
    Video:
      type: object
      required:
        - id
        - title
        - author
        - canBeDownloaded
        - minAgeRestriction
        - createdAt
        - publicationDate
        - availableResolutions
      properties:
        id:
          type: number
          description: "The unique identifier for the driver"
          example: 2
        title:
          type: string
          description: "The full name of title"
          example: "Title"
        author:
          type: string
          description: "The author's name"
          example: "Ivan"
        canBeDownloaded:
          type: boolean
          default: true
          description: "Video can be downloaded"
          example: true
        minAgeRestriction:
          type: string
          nullable: true
          description: "Minimum age restriction"
          example: null
        createdAt:
          type: string
          format: date-time
          description: "The date and time when the video was created"
          example: "2023-03-05T12:00:00Z"
        publicationDate:
          type: string
          format: date-time
          description: "The date and time when the video was published"
          example: "2023-03-05T12:00:00Z"
        availableResolutions:
          type: array
          items:
            type: string
            enum: [ P144, P240, P360, P480, P720, P1080, P1440, P2160 ]
          description: "Resolution available video. Choose from the provided options"
          example: [ "P144", "P360" ]
    CreateVideoInputModel:
      type: object
      required:
        - title
        - author
        - availableResolutions
      properties:
        title:
          type: string
          description: "The full name of title"
          example: "Title"
        author:
          type: string
          description: "The author's name"
          example: "Ivan"
        availableResolutions:
          type: array
          items:
            type: string
            enum: [ P144, P240, P360, P480, P720, P1080, P1440, P2160 ]
          description: "Resolution available video. Choose from the provided options"
          example: [ "P144", "P360" ]
    UpdateVideoInputModel:
      type: object
      required:
        - title
        - author
        - availableResolutions
        - canBeDownloaded
        - minAgeRestriction
        - publicationDate
      properties:
        title:
          type: string
          description: "The full name of title"
          example: "Title"
        author:
          type: string
          description: "The author's name"
          example: "Ivan"
        availableResolutions:
          type: array
          items:
            type: string
            enum: [ P144, P240, P360, P480, P720, P1080, P1440, P2160 ]
          description: "Resolution available video. Choose from the provided options"
          example: [ "P144", "P360" ]
        canBeDownloaded:
          type: boolean
          default: true
          description: "Video can be downloaded"
          example: true
        minAgeRestriction:
          type: string
          nullable: true
          description: "Minimum age restriction"
          example: null
        publicationDate:
          type: string
          format: date-time
          description: "The date and time when the video was published"
          example: "2023-03-05T12:00:00Z"
    Resolutions:
      type: array
      items:
        type: string
        enum: [ P144, P240, P360, P480, P720, P1080, P1440, P2160 ]
      description: "Resolution available video. Choose from the provided options"
      example: [ "P144", "P360" ]
    ValidationError:
      type: object
      properties:
        field:
          type: string
          nullable: true
          example: "name"
        message:
          type: string
          nullable: true
          example: "Invalid name"
    ValidationErrorResponse:
      type: object
      properties:
        errorMessages:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ValidationError'